<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Octavio Garza</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Octavio Garza</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="contact-container">
  <div class="contact-photo">
    <img src="assets/profile.jpg" alt="Octavio Garza">
  </div>

  <div class="contact-info">
    <h2>About Me</h2>
    <p>
      I specialize in cinematic photography and storytelling-driven videography.
      My goal is to create timeless visuals that evoke emotion and authenticity.
    </p>

    <h3>Book a Session</h3>

    <!-- Replace with your Formspree link -->
    <form action="https://formspree.io/f/yourformid" method="POST">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Project details..." required></textarea>
      <button type="submit">Send Inquiry</button>
    </form>

  </div>
</section>

<footer>
  <p>© 2026 Octavio Garza</p>
</footer>

</body>
</html>
