<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Octavio Garza's Portfolio</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Octavio Garza</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="hero">
  <h2>Capturing dreams in the moment.</h2>
</section>


<section class="gallery">
  <h2>Photography</h2>
  <p> catching memories stuck in time</p>

  <div class="masonry">
    <img src="assets/photo1.jpg" onclick="openLightbox(this.src)">
    <img src="assets/photo2.jpg" onclick="openLightbox(this.src)">
    <img src="assets/photo3.jpg" onclick="openLightbox(this.src)">
    <img src="assets/photo4.jpg" onclick="openLightbox(this.src)">
    <img src="assets/photo5.jpg" onclick="openLightbox(this.src)">
    <img src="assets/photo6.jpg" onclick="openLightbox(this.src)">
  </div>
</section>


<section class="gallery">
  <h2>Videography</h2>
  <p>making vivid storytelling</p>
  <div class="flex-grid">
    <video controls>
      <source src="assets/video1.mp4" type="video/mp4">
    </video>
    <video controls>
      <source src="assets/video2.mp4" type="video/mp4">
    </video>
  </div>
</section>


<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img">
</div>

<footer>
  <p>© 2026 Octavio Garza</p>
</footer>

<script src="script.js"></script>
</body>
</html>
